apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: inventory-manager/user-service
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
              name: grpc
          # The settings every service shares (app-config.yaml): ENVIRONMENT,
          # DB_HOST/DB_PORT, OTEL_EXPORTER_OTLP_ENDPOINT, KAFKA_BROKERS.
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: GRPC_ADDR
              value: ":50051"
            - name: DB_NAME
              value: "user_service"
            # Credentials come from .env, through the Secret app-secrets (see the Tiltfile).
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              memory: "256Mi"
          # Kubernetes' built-in gRPC probes call the standard health service.
          readinessProbe:
            grpc:
              port: 50051
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
  selector:
    app: user-service
