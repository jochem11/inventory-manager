apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: inventory-manager/auth-service
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50052
              name: grpc
          # The settings every service shares (app-config.yaml): ENVIRONMENT,
          # DB_HOST/DB_PORT, OTEL_EXPORTER_OTLP_ENDPOINT, KAFKA_BROKERS.
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: GRPC_ADDR
              value: ":50052"
            # From .env: the accounts that get the admin role, and the key that
            # signs access tokens (empty: a new key at every start).
            - name: ADMIN_EMAILS
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ADMIN_EMAILS
                  optional: true
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_PRIVATE_KEY
                  optional: true
            - name: DB_NAME
              value: "auth_service"
            # Credentials come from .env, through the Secret app-secrets (see the Tiltfile).
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
            # The page that reads ?token= from the activation link.
            - name: VERIFY_EMAIL_URL
              value: "http://localhost:3000/verify-email"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              memory: "256Mi"
          # Kubernetes' built-in gRPC probes call the standard health service.
          readinessProbe:
            grpc:
              port: 50052
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 50052
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  ports:
    - name: grpc
      port: 50052
      targetPort: grpc
  selector:
    app: auth-service
