syntax = "proto3";

package auth;

import "google/protobuf/timestamp.proto";

// AuthEvent is every message on the auth.events topic. The message key is
// the user id, so one user's events stay in order.
message AuthEvent {
  // Unique per event; consumers use it to skip events they already handled,
  // since Kafka can deliver a message more than once.
  string event_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  oneof payload {
    IdentityRegistered identity_registered = 10;
  }
}

// IdentityRegistered: someone registered. The user-service creates the
// profile under user_id, which the auth-service generated.
message IdentityRegistered {
  string user_id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  optional string phone = 5;
}
