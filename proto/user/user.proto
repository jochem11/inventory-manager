syntax = "proto3";

package user;

import "google/protobuf/timestamp.proto";

// UserService manages users.
//
// Errors use gRPC status codes: INVALID_ARGUMENT (with google.rpc.BadRequest
// details listing each invalid field), NOT_FOUND for an unknown user and
// ALREADY_EXISTS for an email that is already in use.
service UserService {
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  // GetUsers returns the users it finds, silently skipping unknown ids.
  rpc GetUsers(GetUsersRequest) returns (GetUsersResponse);
  // ListUsers returns one page of users for a paged, sorted, filtered table.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  // UpdateUser replaces all editable fields: a missing required field is an
  // error, and an unset phone or avatar_url is cleared.
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
}

message User {
  // KSUID: 27 base62 characters.
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  // E.164, e.g. "+31612345678".
  optional string phone = 5;
  optional string avatar_url = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// The editable fields of a user, used to create one and to replace one on
// update.
message UserInput {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
  optional string phone = 4;
  optional string avatar_url = 5;
}

message GetUserRequest {
  string id = 1;
}

message GetUserResponse {
  User user = 1;
}

message GetUsersRequest {
  repeated string ids = 1;
}

message GetUsersResponse {
  repeated User users = 1;
}

// Every set field must match as a case-insensitive substring.
message UserFilter {
  // Matches any of the name (including "first last"), email or phone.
  optional string search = 1;
  optional string first_name = 2;
  optional string last_name = 3;
  optional string email = 4;
  optional string phone = 5;
}

message ListUsersRequest {
  int32 offset = 1;
  // Page size, 1 to 100. Defaults to 10 when unset.
  int32 limit = 2;
  // Field to sort by: first_name, last_name, email, phone, created_at or
  // updated_at. Empty sorts by id (roughly creation order); ties always break
  // on id.
  string order_by = 3;
  // "asc" (default) or "desc". Only used together with order_by.
  string sort_direction = 5;
  UserFilter filter = 4;
}

message ListUsersResponse {
  repeated User users = 1;
  // Users matching the filter across all pages.
  int32 total_count = 2;
}

message CreateUserRequest {
  UserInput user = 1;
}

message CreateUserResponse {
  User user = 1;
}

message UpdateUserRequest {
  string id = 1;
  UserInput user = 2;
}

message UpdateUserResponse {
  User user = 1;
}

message DeleteUserRequest {
  string id = 1;
}

message DeleteUserResponse {}
